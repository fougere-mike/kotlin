/**
 * BrightScript target configuration for kotlin-stdlib.
 *
 * This is a Groovy script (not Kotlin DSL) because:
 * 1. The `brs {}` DSL function is generated by KGP and only exists when KGP has BRS support
 * 2. Kotlin DSL scripts are compiled before execution - if `brs` doesn't exist, compilation fails
 * 3. Groovy uses dynamic dispatch - method resolution happens at runtime, not compile time
 * 4. This script is only applied when kgpHasBrsSupport=true, so `brs` will always exist
 *
 * See CLAUDE.md "Bootstrap Architecture" section for details.
 */

kotlin {
    brs {
        compilations.all {
            // Configure the BRS compiler JAR path and stdlib mode
            brsCompileTaskProvider.configure {
                // Ensure compiler JAR is built before stdlib compilation
                dependsOn(":compiler:cli-brs:fatJar")
                compilerJar.set(new File(rootDir, "compiler/cli/cli-brs/build/libs/kotlinc-brs-${project.version}.jar"))
                stdlibCompilation.set(true)
            }
        }
    }

    // Configure BRS source sets
    sourceSets {
        def brsDir = "${projectDir}/brs"
        def brsActualDir = "${projectDir}/brs-actual"

        brsMain {
            // BRS now uses native compiler with actual implementations
            dependsOn(commonMain)
            kotlin {
                // Bootstrap base implementations (builtins removed - identical to brs-actual)
                srcDir("$brsDir/runtime")
                srcDir("$brsDir/src")
                // Native BRS actual implementations
                srcDir("$brsActualDir/builtins")
                // Note: brs-actual/runtime is empty, so not included
                srcDir("$brsActualDir/src")
                // Note: Conflicting files (ArraySorting.kt, StringBuilder.kt) were deleted from brs/
            }
        }
        brsTest {
            dependsOn(commonTest)
            // No test sources yet in brs-actual
        }
    }

    // Add prebuilt klib artifact to BRS configurations for publishing
    def prebuiltKlib = file("brs-prebuilt/kotlin-stdlib-brs.klib")
    if (prebuiltKlib.exists()) {
        artifacts {
            add("brsApiElements", prebuiltKlib) {
                type = "klib"
                extension = "klib"
                classifier = null
            }
            add("brsRuntimeElements", prebuiltKlib) {
                type = "klib"
                extension = "klib"
                classifier = null
            }
        }
    }

    // Task to compile stdlib Kotlin sources to BrightScript source files
    // This runs the compiler in executable mode (default) to generate .brs files
    // The regenerateKlib task produces a klib (IR bytecode), but downstream projects
    // need the actual .brs source files to include in Roku packages
    def generateStdlibBrs = tasks.register("generateStdlibBrs", JavaExec) {
        group = "build"
        description = "Generate BrightScript source files from stdlib Kotlin sources"

        def compilerJar = new File(rootDir, "compiler/cli/cli-brs/build/libs/kotlinc-brs-${project.version}.jar")
        def brsOutputDir = layout.buildDirectory.dir("brs-runtime")

        dependsOn(":compiler:cli-brs:fatJar")

        classpath = files(compilerJar)
        mainClass.set("org.jetbrains.kotlin.cli.brs.K2BrsCompiler")

        // Collect source directories - same as regenerateKlib and brsMain source set
        def brsDir = "${projectDir}/brs"
        def brsActualDir = "${projectDir}/brs-actual"
        def sourceDirs = [
            file("${brsDir}/runtime"),
            file("${brsDir}/src"),
            file("${brsActualDir}/builtins"),
            file("${brsActualDir}/src"),
        ].findAll { it.exists() }

        doFirst {
            if (!compilerJar.exists()) {
                throw new GradleException(
                    "BRS Compiler not found at ${compilerJar}. " +
                    "Run ':compiler:cli-brs:fatJar' first."
                )
            }
        }

        args(
            "-output-dir", brsOutputDir.get().asFile.absolutePath,
            "-Xstdlib-compilation",
            "-Xallow-kotlin-package",
            "-module-name", "kotlin-stdlib-brs",
            *sourceDirs.collect { it.absolutePath }
        )

        inputs.files(sourceDirs)
        outputs.dir(brsOutputDir)
    }

    // Create a JAR containing the compiled .brs runtime files for packaging
    // The compiler outputs .brs files to <output-dir>/source/ per BrsCompiler.writeOutput()
    def brsBrsJar = tasks.register("brsBrsJar", Jar) {
        archiveClassifier.set("brs-runtime")
        from(layout.buildDirectory.dir("brs-runtime/source"))
        dependsOn(generateStdlibBrs)
    }

    // Add the runtime JAR to brsRuntimeElements for resolution by downstream projects
    artifacts {
        add("brsRuntimeElements", brsBrsJar) {
            classifier = "brs-runtime"
        }
    }
}
