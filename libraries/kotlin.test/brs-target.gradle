/**
 * BrightScript target configuration for kotlin.test.
 *
 * This is a Groovy script (not Kotlin DSL) because:
 * 1. The `brs {}` DSL function is generated by KGP and only exists when KGP has BRS support
 * 2. Kotlin DSL scripts are compiled before execution - if `brs` doesn't exist, compilation fails
 * 3. Groovy uses dynamic dispatch - method resolution happens at runtime, not compile time
 * 4. This script is only applied when kgpHasBrsSupport=true, so `brs` will always exist
 *
 * See CLAUDE.md "Bootstrap Architecture" section for details.
 */

kotlin {
    brs {
        compilations.all {
            // Configure the BRS compiler JAR path
            brsCompileTaskProvider.configure {
                compilerJar.set(rootDir.resolve("compiler/cli/cli-brs/build/libs/kotlinc-brs-${project.version}.jar"))
            }
        }
        compilations["main"].compileTaskProvider.configure {
            compilerOptions.freeCompilerArgs.add("-Xir-module-name=${org.jetbrains.kotlin.library.KOTLINTEST_MODULE_NAME}")
        }
    }

    sourceSets {
        brsMain {
            kotlin.srcDir("brs/src/main/kotlin")
        }
        // Configure dependsOn after source set is accessed
        getByName("brsMain").dependsOn(getByName("assertionsCommonMain"))
        getByName("brsMain").dependsOn(getByName("annotationsCommonMain"))
    }
}
